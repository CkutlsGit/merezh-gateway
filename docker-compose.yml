services:
  postgres-userservice:
    container_name: postgres-userservice
    image: postgres:18.6-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=userservice-merezh
    volumes:
      - userservice-data:/var/lib/postgresql
    networks:
      - dbnet
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d userservice-merezh" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-authservice:
    container_name: postgres-authservice
    image: postgres:18.6-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=authservice-merezh
    volumes:
      - authservice-data:/var/lib/postgresql
    networks:
      - dbnet
    restart: always
    depends_on:
      - postgres-userservice
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d authservice-merezh" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-orderservice:
    container_name: postgres-orderservice
    image: postgres:18.6-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=orderservice-merezh
    volumes:
      - orderservice-data:/var/lib/postgresql
    networks:
      - dbnet
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d orderservice-merezh" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-paymentservice:
    container_name: postgres-paymentservice
    image: postgres:18.6-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=paymentservice-merezh
    volumes:
      - paymentservice-data:/var/lib/postgresql
    networks:
      - dbnet
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d paymentservice-merezh" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-walletservice:
    container_name: postgres-walletservice
    image: postgres:18.6-alpine3.23
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=walletservice-merezh
    volumes:
      - walletservice-data:/var/lib/postgresql
    networks:
      - dbnet
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d walletservice-merezh" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  userservice-merezh:
    container_name: userservice-merezh
    build: ../userservice-merezh
    restart: always
    networks:
      - dbnet
    depends_on:
        postgres-userservice:
          condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  authservice-merezh:
    container_name: authservice-merezh
    build: ../authservice-merezh
    restart: always
    networks:
      - dbnet
    depends_on:
      postgres-authservice:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  orderservice-merezh:
    container_name: orderservice-merezh
    build: ../orderservice-merezh
    restart: always
    networks:
      - dbnet
    depends_on:
      postgres-orderservice:
          condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8085/actuator/health/readiness" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  paymentservice-merezh:
    container_name: paymentservice-merezh
    build: ../paymentservice-merezh
    restart: always
    networks:
      - dbnet
    depends_on:
      postgres-paymentservice:
          condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8084/actuator/health/readiness" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  walletservice-merezh:
    container_name: walletservice-merezh
    build: ../walletservice-merezh
    restart: always
    networks:
      - dbnet
    depends_on:
        postgres-walletservice:
          condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8083/actuator/health/readiness" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway-merezh:
    container_name: gateway-merezh
    build: .
    restart: always
    networks:
      - dbnet
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - userservice-merezh
      - authservice-merezh
      - orderservice-merezh
      - walletservice-merezh
      - paymentservice-merezh

networks:
  dbnet:
    driver: bridge
volumes:
  userservice-data:
  authservice-data:
  paymentservice-data:
  walletservice-data:
  orderservice-data: